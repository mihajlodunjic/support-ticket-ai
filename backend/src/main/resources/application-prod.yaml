spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    token-validity-seconds: ${APP_SECURITY_TOKEN_VALIDITY_SECONDS:3600}
    admin:
      name: ${APP_SECURITY_ADMIN_NAME:}
      email: ${APP_SECURITY_ADMIN_EMAIL:}
      password: ${APP_SECURITY_ADMIN_PASSWORD:}
