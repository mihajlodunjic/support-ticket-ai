spring:
  application:
    name: helpdesk-backend
  profiles:
    default: local

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ai:
    base-url: ${APP_AI_BASE_URL:http://localhost:8000}
    predict-path: ${APP_AI_PREDICT_PATH:/predict}
    timeout-seconds: ${APP_AI_TIMEOUT_SECONDS:5}
    fallback-category: ${APP_AI_FALLBACK_CATEGORY:Other}
    top-predictions-limit: ${APP_AI_TOP_PREDICTIONS_LIMIT:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
